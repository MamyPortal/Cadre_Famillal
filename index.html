<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Cadre familial</title>

<meta name="theme-color" content="#09111f">
<meta name="description" content="Cadre familial">

<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="styles.css">

</head>

<body>

<main class="shell">

    <!-- ========================= -->
    <!-- ENTETE -->
    <!-- ========================= -->

    <header class="hero card">

        <div class="hero-left">

            <p id="subtitle" class="eyebrow">
                Cadre familial
            </p>

            <h1 id="title">
                Bonjour
            </h1>

            <p id="familyNotes" class="small muted">
                Chargement...
            </p>

        </div>

        <div class="hero-right">

            <div id="dateLine" class="date-line">
                --
            </div>

            <div id="timeLine" class="time-line">
                --:--
            </div>

            <div id="onlineLine" class="online-line">
                En ligne
            </div>

        </div>

    </header>


    <!-- ========================= -->
    <!-- METEO + MESSAGE -->
    <!-- ========================= -->

    <section class="top-row">

        <article class="card weather-card">

            <div class="panel-title">
                Météo
            </div>

            <div id="weatherMain" class="weather-main">
                --
            </div>

            <div id="weatherDetails" class="muted">
                Chargement...
            </div>

        </article>

        <article class="card message-card">

            <div class="panel-title">
                Message de la famille
            </div>

            <div id="messageBox" class="message-box">
                --
            </div>

        </article>

    </section>


    <!-- ========================= -->
    <!-- PHOTO -->
    <!-- ========================= -->

    <section class="card photo-card">

        <div class="photo-stage">

            <img
                id="photoImg"
                alt="Photos de la famille">

            <div
                id="photoLabel"
                class="photo-label">

                --

            </div>

        </div>

    </section>


    <!-- ========================= -->
    <!-- BOUTONS -->
    <!-- ========================= -->

    <section class="actions">

        <a
            id="whatsappLink"
            class="cta"
            href="#">

            WhatsApp

        </a>

        <button
            id="refreshBtn"
            class="secondary"
            type="button">

            Rafraîchir

        </button>

        <a
            id="photoLink"
            class="secondary"
            href="#">

            Photos

        </a>

    </section>


    <!-- ========================= -->
    <!-- LIENS -->
    <!-- ========================= -->

    <section class="card footer-card">

        <div class="panel-title">

            Liens de la famille

        </div>

        <div
            id="linkList"
            class="link-list">

        </div>

    </section>


    <footer class="footer">

        Cadre familial • Redmi Pad 2

    </footer>

</main>

<script src="app.js"></script>

</body>

</html>
